<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Progresso</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#0b1220;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --line:rgba(148,163,184,.18);
      --shadow: 0 12px 32px rgba(0,0,0,.35);
      --radius: 18px;
      --tap: 52px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background: radial-gradient(1200px 800px at 20% -10%, #1f2a44 0%, transparent 60%),
                  radial-gradient(900px 700px at 100% 0%, #19344a 0%, transparent 55%),
                  var(--bg);
      color:var(--text);
    }
    .safe{min-height:100vh;}
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(11,18,32,.92), rgba(11,18,32,.72));
      border-bottom:1px solid var(--line);
    }
    .wrap{max-width:720px; margin:0 auto; padding:14px;}
    .row{display:flex; align-items:center; gap:10px}
    .space{justify-content:space-between}
    .title{font-size:18px; font-weight:800}
    .btn{
      height:var(--tap); padding:0 14px; border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:var(--text); font-weight:700; cursor:pointer;
    }
    .btn.primary{background:rgba(34,197,94,.25)}
    .grid{display:grid; gap:12px; padding:14px; max-width:720px; margin:0 auto;}
    .card{
      border-radius:18px; border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      box-shadow:var(--shadow);
    }
    .card .top{
      padding:14px; display:flex; justify-content:space-between;
      border-bottom:1px solid var(--line);
    }
    .emoji{font-size:22px}
    .goalName{font-weight:900}
    .goalSub{font-size:12px; color:var(--muted)}
    .body{padding:14px}
    .opts{display:flex; flex-wrap:wrap; gap:10px}
    .chip{
      padding:10px 12px; border-radius:999px;
      border:1px solid var(--line);
      background:rgba(15,23,42,.45);
      cursor:pointer; font-weight:800;
    }
    .modalOverlay{
      position:fixed; inset:0; background:rgba(0,0,0,.88);
      display:none; align-items:flex-end; z-index:50;
    }
    .modal{
      width:100%; max-width:720px; margin:auto;
      background:#0f172a; border-radius:22px;
    }
  </style>
</head>

<body>
<div class="safe">
  <header>
    <div class="wrap row space">
      <div class="title">📌 Progresso</div>
      <button class="btn primary" id="btnNewGoal">➕ Nova lista</button>
    </div>
  </header>

  <main>
    <div class="grid" id="goalsGrid"></div>
  </main>
</div>

<script>
(() => {
  // ===================== SUPABASE =====================
  const SUPABASE_URL = "https://olreyltrohxzfxzajgqd.supabase.co";
  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9scmV5bHRyb2h4emZ4emFqZ3FkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4Mzc0MDcsImV4cCI6MjA4MzQxMzQwN30.0vkpN0XQN-FRTdOv1fxRKFKwpRDiRIEJ3w8kfjLyMBk";

  const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const LOCAL_KEY = "progress_pwa_v1";
  const TABLE = "app_state";

  let state = { goals: [] };
  let currentUser = null;
  let saveTimer = null;

  function loadLocal() {
    try {
      return JSON.parse(localStorage.getItem(LOCAL_KEY)) || { goals: [] };
    } catch {
      return { goals: [] };
    }
  }

  function saveLocalAndCloud() {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
    if (!currentUser) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      await supabase.from(TABLE).upsert({
        user_id: currentUser.id,
        data: state,
        updated_at: new Date().toISOString()
      });
    }, 400);
  }

  async function ensureLogin() {
    const { data:{session} } = await supabase.auth.getSession();
    if (session?.user) return session.user;

    const email = prompt("Digite seu e-mail para sincronizar:");
    if (!email) return null;

    await supabase.auth.signInWithOtp({
      email,
      options:{ emailRedirectTo: location.href }
    });
    alert("Confira seu e-mail e clique no link para entrar.");
    return null;
  }

  async function loadFromCloud(user) {
    const { data } = await supabase
      .from(TABLE)
      .select("data")
      .eq("user_id", user.id)
      .single();
    return data?.data;
  }

  function render() {
    const el = document.getElementById("goalsGrid");
    el.innerHTML = "";
    state.goals.forEach(g => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="top">
          <div>
            <div class="goalName">${g.emoji || "🎯"} ${g.name}</div>
            <div class="goalSub">${g.log?.length || 0} registros</div>
          </div>
        </div>
        <div class="body">
          <div class="opts">
            ${(g.options||[]).map(o=>`
              <div class="chip">${o.text}</div>
            `).join("")}
          </div>
        </div>`;
      el.appendChild(card);
    });
  }

  (async () => {
    state = loadLocal();
    render();

    currentUser = await ensureLogin();
    if (!currentUser) return;

    const cloud = await loadFromCloud(currentUser);
    if (cloud) {
      state = cloud;
      localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
      render();
    } else {
      saveLocalAndCloud();
    }

    supabase.auth.onAuthStateChange(async (_e, session) => {
      if (!session?.user) return;
      currentUser = session.user;
      const cloud2 = await loadFromCloud(currentUser);
      if (cloud2) {
        state = cloud2;
        localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
        render();
      }
    });
  })();
})();
</script>
</body>
</html>
